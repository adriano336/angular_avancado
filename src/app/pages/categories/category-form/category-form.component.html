<nav class="mb-5">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/">Home</a>
    </li>
    <li class="breadcrumb-item">
      <a routerLink="/categories">Categorias</a>
    </li>
    <li class="breadcrumb-item">
      <a routerLink="/" [routerLinkActive]="['active']" routerLinkActive="router-link-active">Formulário de
        categorias</a>
    </li>
  </ol>
</nav>

<div class="row mb-4">
  <div class="col-md">
    <h1 class="h2 border-left pl-2">{{pageTitle}}</h1>
  </div>
  <div class="col-md">
    <a routerLink="/categories" class="btn btn-light float-end">
      << Voltar</a>
  </div>
</div>

<form [formGroup]="categoryForm" (submit)="submitForm()">

  <div class="card">
    <div class="card-header">
      {{pageTitle}}
    </div>

    <div class="card-body">
      <div class="row">

        <div class="col-md-4">
          <label for="name" class="form-label">Nome</label>
          <input type="text" id="name" formControlName="name" class="form-control">
          <div class="text-danger" *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">
            <div *ngIf="categoryForm.get('name')?.getError('required')">Dado obrigatório</div>
            <div *ngIf="categoryForm.get('name')?.getError('minLenght')">Deve ter ao menos 2 caracters</div>
          </div>
        </div>

        <div class="col-md-8">
          <label for="description" class="form-label">Descricao</label>
          <input type="text" class="form-control" id="description">
        </div>

      </div>
    </div>
  </div>

  <button [disabled]="submittingForm || categoryForm.invalid" type="submit"
    class="btn btn-primary btn-lg float-end mt-3">
    Salvar
  </button>

</form>
