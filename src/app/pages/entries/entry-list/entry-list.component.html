<nav class="mb-5">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/">Home</a>
    </li>
    <li class="breadcrumb-item">
      Lançamentos
    </li>
  </ol>
</nav>

<div class="row mb-4">
  <div class="col-md">
    <h1 class="h2 border-left pl-2">Lançamentos</h1>
  </div>
  <div class="col-md">
    <a routerLink="new" class="btn btn-success float-end">+ Novo lançamento</a>
  </div>
</div>
<table class=" table table-over">
  <thead>
    <tr class="bg-primary text-light">
      <th>
        Lançamentos
      </th>
      <th>
        Categoria
      </th>
      <th>
        Valor ($)
      </th>
      <th>
        Ações
      </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let entry of entries">
      <td>
        <strong>{{entry.name}}</strong><br>
        <small class="text-success">{{ entry.date }}</small><br>
        <small *ngIf="entry.description">{{ entry.description}}</small>
      </td>
      <td>
        {{ entry.category?.name}}
      </td>
      <td>
        <a [routerLink]="[entry.id, 'edit']" class="btn btn-outline-info btn-sm me-2">Editar</a>
        <a (click)="excluirEntry(entry)" class="btn btn-outline-danger btn-sm">Excluir</a>
      </td>
    </tr>
  </tbody>
</table>
